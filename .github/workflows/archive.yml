name: Archive old completed tasks

on:
  schedule:
    # 18:30 UTC = ~00:00 IST. GitHub may delay scheduled runs by a few
    # minutes at busy times; that's fine for a once-a-day housekeeping job.
    - cron: "30 18 * * *"
  workflow_dispatch: {}   # lets you trigger it manually from the Actions tab

permissions:
  contents: write

jobs:
  archive:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Archive completed tasks older than 30 days
        run: python scripts/archive_completed.py

      - name: Commit changes if any
        run: |
          git config user.name "task-diary-bot"
          git config user.email "actions@users.noreply.github.com"
          if git diff --quiet; then
            echo "No changes to commit."
          else
            git add data/
            git commit -m "Archive completed tasks older than 30 days"
            git push
          fi
